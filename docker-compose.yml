# Full local stack from source (`docker compose up --build`) — API + web app.
# The API uses a SQLite file on a named volume; the web container serves the built
# SPA on :8080 and proxies /api to the API container. The API auto-seeds 10,000
# employees on first start (idempotent). To run from prebuilt images instead, use
# docker-compose.images.yml.
services:
  api:
    build: ./backend
    environment:
      DATABASE_URL: sqlite:////data/acme_salary.db
      CORS_ORIGINS: http://localhost:8080
      # Logging is overridable from the root .env (parity with the LLM vars below).
      # Default console for readable `docker logs`; set LOG_FORMAT=json for
      # machine-parseable prod-like logs. LOG_LEVEL=debug widens the trace further.
      LOG_FORMAT: ${LOG_FORMAT:-console}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SEED_ON_STARTUP: "true"
      # LLM config passed through from a gitignored root .env (or the host env).
      # Empty keys -> the app uses a safe offline stub. Never commit real keys.
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - api_data:/data
    ports:
      - "8000:8000"

  web:
    build: ./web
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  api_data:
