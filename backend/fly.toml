# Fly.io deployment for the API. Builds the Dockerfile, mounts a volume for the
# SQLite file, and health-checks /healthz. For production-grade concurrency, set the
# DATABASE_URL secret to a Neon PostgreSQL URL instead (ADR-0002) and drop the mount.
app = "acme-salary-api-rajaa"
primary_region = "bom"

[build]

[env]
  DATABASE_URL = "sqlite:////data/acme_salary.db"
  # Console + INFO to match the project default (readable `fly logs`); the /ask trace
  # logs prompt/output/SQL at INFO (ADR-0013). Override per-deploy via fly secrets if needed.
  LOG_FORMAT = "console"
  LOG_LEVEL = "INFO"
  # Auto-seed 10k employees on first boot when the volume is empty (idempotent).
  SEED_ON_STARTUP = "true"
  # Set CORS_ORIGINS to the deployed web origin: fly secrets set CORS_ORIGINS=https://<app>.vercel.app

[[mounts]]
  source = "acme_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  # Keep one instance warm: min_machines_running = 1 stops Fly from idling the last
  # running machine, so it stays up once started (the first request after a deploy may
  # still cold-start it, since min is enforced on request, not proactively). auto_start
  # boots it on demand; auto_stop trims any extra machines. For pure scale-to-zero
  # (lowest cost, cold start after each idle period), set min_machines_running = 0.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/readyz"
    interval = "15s"
    timeout = "2s"
