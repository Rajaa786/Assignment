[project]
name = "acme-salary-api"
version = "0.1.0"
description = "ACME salary management API — FastAPI backend for HR salary management."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "alembic>=1.13",
    "httpx>=0.27",
    "structlog>=24.1",
    "slowapi>=0.1.9",
    "anthropic>=0.39",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "factory-boy>=3.3",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]
# Autogenerated Alembic migrations are not hand-edited prose; exclude them from
# lint (hand-written alembic/env.py is still linted).
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "B008",   # FastAPI Depends() in defaults is the framework idiom
    "UP046",  # keep `Generic[T]` form for Pydantic v2 generic models (PEP 695 not used)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
# `disallow_any_explicit` is intentionally not enabled: it flags library base
# classes (pydantic BaseSettings) and stubs, not our code. We keep `--strict`
# and avoid `Any` by convention (CLAUDE.md §11), reaching for `object` instead.

[[tool.mypy.overrides]]
module = ["factory.*", "slowapi.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["slow: end-to-end tests hitting real external services (deselected by default)"]
filterwarnings = ["error::DeprecationWarning"]
