# Run the app from PUBLISHED images — no source checkout, no build.
#
#   docker compose -f docker-compose.images.yml up
#   -> open http://localhost:8080   (auto-seeded with 10,000 employees on first start)
#
# Replace OWNER below with the GitHub username/org that owns the images, or pass it
# at runtime:  GHCR_OWNER=<owner> docker compose -f docker-compose.images.yml up
services:
  api:
    image: ghcr.io/${GHCR_OWNER:-OWNER}/acme-salary-api:latest
    environment:
      DATABASE_URL: sqlite:////data/acme_salary.db
      CORS_ORIGINS: http://localhost:8080
      # Logging is overridable from the root .env (parity with the LLM vars below).
      # Default console for readable `docker logs`; set LOG_FORMAT=json for
      # machine-parseable prod-like logs. LOG_LEVEL=debug widens the trace further.
      LOG_FORMAT: ${LOG_FORMAT:-console}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SEED_ON_STARTUP: "true"
      # LLM config passed through from a gitignored root .env (or the host env).
      # Empty keys -> the app uses a safe offline stub. Never commit real keys.
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - api_data:/data
    ports:
      - "8000:8000"

  web:
    image: ghcr.io/${GHCR_OWNER:-OWNER}/acme-salary-web:latest
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  api_data:
